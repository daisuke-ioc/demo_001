# MQTT Broker Presets
# Add or remove brokers here — the app will load this list on startup.

[[broker]]
name    = "HiveMQ Public"
host    = "broker.hivemq.com"
ws_port = 8000
wss_port = 8884
notes   = "Free public broker — no auth required"

[[broker]]
name    = "EMQX Public"
host    = "broker.emqx.io"
ws_port = 8083
notes   = "EMQX public broker — no auth required"

[[broker]]
name    = "EMQX Public (TLS)"
host    = "broker.emqx.io"
wss_port = 8084
notes   = "EMQX public broker — WSS/TLS"

[[broker]]
name    = "Eclipse Mosquitto"
host    = "test.mosquitto.org"
ws_port = 8080
notes   = "Eclipse Foundation public test broker"


[[broker]]
name    = "Eclipse Mosquitto (TLS)"
host    = "test.mosquitto.org"
wss_port = 8081
notes   = "Eclipse Mosquitto with TLS — cert required.  Install from http://test.mosquitto.org/ssl/mosquitto.org.crt"